<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 360" width="300" height="360">
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#0E4F3C" stroke-width="1" opacity=".35"/>
    </pattern>
  </defs>
  <!-- shadow paper -->
  <rect x="70" y="58" width="168" height="222" fill="url(#hatch)" transform="rotate(6 154 169)"/>
  <!-- main paper -->
  <g transform="rotate(-4 150 180)">
    <rect x="62" y="48" width="172" height="228" fill="#FBF7EF" stroke="#0E4F3C" stroke-width="2.5"/>
    <text x="148" y="86" text-anchor="middle" font-family="Playfair Display, serif" font-size="13" font-weight="800" fill="#0E4F3C" letter-spacing="1.5">LAST WILL</text>
    <text x="148" y="102" text-anchor="middle" font-family="Playfair Display, serif" font-size="10" font-style="italic" fill="#9C7230">and Testament</text>
    <line x1="112" y1="112" x2="184" y2="112" stroke="#B8893A" stroke-width="1.5"/>
    <g stroke="#0E4F3C" stroke-width="1.6" opacity=".55">
      <line x1="80" y1="132" x2="216" y2="132"/><line x1="80" y1="146" x2="210" y2="146"/>
      <line x1="80" y1="160" x2="216" y2="160"/><line x1="80" y1="174" x2="196" y2="174"/>
      <line x1="80" y1="188" x2="214" y2="188"/><line x1="80" y1="202" x2="170" y2="202"/>
    </g>
    <!-- empty signature line -->
    <line x1="80" y1="248" x2="190" y2="248" stroke="#0E4F3C" stroke-width="2"/>
    <text x="80" y="262" font-family="Inter, sans-serif" font-size="8" fill="#8C6A2A" letter-spacing="1.5">SIGNATURE</text>
    <text x="196" y="250" font-family="Playfair Display, serif" font-size="34" font-weight="800" fill="#9C7230">?</text>
  </g>
  <!-- fountain pen, uncapped, unused -->
  <g transform="rotate(-38 230 300)">
    <rect x="150" y="292" width="110" height="16" rx="8" fill="#0E4F3C"/>
    <rect x="236" y="292" width="6" height="16" fill="#B8893A"/>
    <path d="M150 292 L122 300 L150 308 Z" fill="#B8893A"/>
    <line x1="124" y1="300" x2="146" y2="300" stroke="#0E4F3C" stroke-width="1.2"/>
  </g>
</svg>
