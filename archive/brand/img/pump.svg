<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 360" width="300" height="360">
  <defs>
    <pattern id="h2" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#0E4F3C" stroke-width="1" opacity=".4"/>
    </pattern>
  </defs>
  <!-- ground -->
  <line x1="40" y1="318" x2="260" y2="318" stroke="#0E4F3C" stroke-width="2"/>
  <!-- globe on top -->
  <ellipse cx="132" cy="62" rx="36" ry="30" fill="#FBF7EF" stroke="#0E4F3C" stroke-width="2.5"/>
  <line x1="102" y1="62" x2="162" y2="62" stroke="#B8893A" stroke-width="1.5"/>
  <rect x="116" y="88" width="32" height="10" fill="#0E4F3C"/>
  <!-- body -->
  <path d="M96 98 H168 V300 H96 Z" fill="#FBF7EF" stroke="#0E4F3C" stroke-width="2.5"/>
  <rect x="168" y="110" width="10" height="190" fill="url(#h2)" stroke="#0E4F3C" stroke-width="1.5"/>
  <!-- dial window -->
  <circle cx="132" cy="146" r="24" fill="#FBF7EF" stroke="#0E4F3C" stroke-width="2"/>
  <circle cx="132" cy="146" r="2.5" fill="#0E4F3C"/>
  <line x1="132" y1="146" x2="145" y2="134" stroke="#9C7230" stroke-width="2"/>
  <g stroke="#0E4F3C" stroke-width="1.2">
    <line x1="132" y1="125" x2="132" y2="130"/><line x1="153" y1="146" x2="148" y2="146"/>
    <line x1="111" y1="146" x2="116" y2="146"/><line x1="147" y1="131" x2="144" y2="134"/>
  </g>
  <!-- price panel -->
  <rect x="108" y="186" width="48" height="26" fill="none" stroke="#0E4F3C" stroke-width="1.6"/>
  <text x="132" y="204" text-anchor="middle" font-family="Playfair Display, serif" font-size="14" font-weight="800" fill="#0E4F3C">¢</text>
  <!-- hatching lower body -->
  <rect x="104" y="226" width="56" height="66" fill="url(#h2)"/>
  <!-- base -->
  <rect x="88" y="300" width="88" height="18" fill="#0E4F3C"/>
  <!-- hose & nozzle -->
  <path d="M168 128 C 214 128, 222 190, 206 236 C 198 258, 214 270, 226 262" fill="none" stroke="#0E4F3C" stroke-width="5" stroke-linecap="round"/>
  <path d="M222 252 L246 240 L250 248 L232 262 Z" fill="#B8893A" stroke="#0E4F3C" stroke-width="1.5"/>
  <!-- coin stack -->
  <g fill="#FBF7EF" stroke="#9C7230" stroke-width="2">
    <ellipse cx="226" cy="310" rx="22" ry="6"/><ellipse cx="226" cy="302" rx="22" ry="6"/>
    <ellipse cx="226" cy="294" rx="22" ry="6"/><ellipse cx="226" cy="286" rx="22" ry="6"/>
  </g>
</svg>
